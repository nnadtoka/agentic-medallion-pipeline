template_id: top_n_by_metric
name: Top N by metric, grouped by dimension
description: >
  Ranks a business metric -- order count, GMV, average order value, average
  review score, late delivery rate, freight-to-item-value ratio, or
  cancellation rate -- grouped by a dimension, over an optional date range.
  Answers questions like "which states have the highest GMV this quarter"
  or "which states have the worst late delivery rate".
sql_template: |
  select
      {dimension} as dimension_value,
      {metric} as metric_value
  from gold.fct_orders o
  join gold.dim_customer c on c.customer_id = o.customer_id
  where (%(date_from)s::date is null or o.order_purchase_timestamp >= %(date_from)s::date)
    and (%(date_to)s::date is null or o.order_purchase_timestamp < %(date_to)s::date + interval '1 day')
  group by {dimension}
  order by metric_value desc nulls last
  limit %(limit)s
target_schema: gold
max_limit: 100
parameters:
  - name: dimension
    kind: identifier
    type: string
    required: true
    enum:
      customer_state: c.customer_state
    # Only customer_state ships in v1. fct_orders is order-grained and
    # dim_customer joins 1:1 on customer_id, so this dimension is fan-out
    # safe. product_category/seller_state/payment_type all join through
    # fct_order_items or fct_order_payments, which can have multiple rows
    # per order -- adding them here as-is would silently double-count
    # order-level metrics (order_count, gmv) for multi-item/split-payment
    # orders. Deferred until the metric expressions are reworked to
    # de-duplicate first.
  - name: metric
    kind: identifier
    type: string
    required: true
    enum:
      order_count: count(*)
      gmv: sum(o.order_item_value)
      avg_order_value: avg(o.order_item_value)
      avg_review_score: avg(o.average_review_score)
      late_delivery_rate: >-
        avg(case when o.order_delivered_customer_date is not null
                 and o.order_estimated_delivery_date is not null
                 then (o.order_delivered_customer_date > o.order_estimated_delivery_date)::int
            end)
      freight_ratio: sum(o.freight_value) / nullif(sum(o.item_value), 0)
      cancellation_rate: avg((o.order_status = 'canceled')::int)
  - name: date_from
    kind: value
    type: date
    required: false
  - name: date_to
    kind: value
    type: date
    required: false
  - name: limit
    kind: value
    type: integer
    required: false
    default: 10
    min: 1
