version: 2

sources:
  - name: bronze
    schema: bronze
    description: Raw Olist tables loaded by the ingestion pipeline with source values preserved and ingestion metadata appended.
    tables:
      - name: raw_orders
        description: Date-partitioned Olist order records at one row per order.
        columns:
          - {name: order_id, description: "Unique identifier assigned to the order."}
          - {name: customer_id, description: "Customer identifier associated with the order."}
          - {name: order_status, description: "Latest source-system status of the order."}
          - {name: order_purchase_timestamp, description: "Timestamp when the customer placed the order."}
          - {name: order_purchase_date, description: "Calendar date derived from order_purchase_timestamp for incremental ingestion."}
          - {name: order_approved_at, description: "Timestamp when payment approval was recorded."}
          - {name: order_delivered_carrier_date, description: "Timestamp when the order was handed to the carrier."}
          - {name: order_delivered_customer_date, description: "Timestamp when the order was delivered to the customer."}
          - {name: order_estimated_delivery_date, description: "Estimated customer delivery timestamp provided at purchase."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_order_items
        description: Full-refresh Olist order line items at one row per order and item sequence.
        columns:
          - {name: order_id, description: "Identifier of the order containing the item."}
          - {name: order_item_id, description: "One-based item sequence within the order."}
          - {name: product_id, description: "Identifier of the purchased product."}
          - {name: seller_id, description: "Identifier of the seller fulfilling the item."}
          - {name: shipping_limit_date, description: "Seller shipping deadline for the item."}
          - {name: price, description: "Item price in Brazilian reais."}
          - {name: freight_value, description: "Freight amount allocated to the item in Brazilian reais."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_order_payments
        description: Full-refresh Olist payment records at one row per order and payment sequence.
        columns:
          - {name: order_id, description: "Identifier of the order receiving the payment."}
          - {name: payment_sequential, description: "Sequence of the payment record within the order."}
          - {name: payment_type, description: "Payment method reported by Olist."}
          - {name: payment_installments, description: "Number of installments selected for the payment."}
          - {name: payment_value, description: "Payment amount in Brazilian reais."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_order_reviews
        description: Date-partitioned Olist customer reviews, potentially containing multiple reviews per order.
        columns:
          - {name: review_id, description: "Identifier assigned to the review."}
          - {name: order_id, description: "Identifier of the reviewed order."}
          - {name: review_score, description: "Customer satisfaction score from 1 through 5."}
          - {name: review_comment_title, description: "Optional review title supplied by the customer."}
          - {name: review_comment_message, description: "Optional review text supplied by the customer."}
          - {name: review_creation_date, description: "Timestamp when the review survey was created."}
          - {name: review_answer_timestamp, description: "Timestamp when the customer submitted the review."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_customers
        description: Full-refresh Olist customer records at one row per order-specific customer identifier.
        columns:
          - {name: customer_id, description: "Order-specific customer identifier used by the orders dataset."}
          - {name: customer_unique_id, description: "Stable identifier used to recognize the same customer across orders."}
          - {name: customer_zip_code_prefix, description: "First five digits of the customer's postal code."}
          - {name: customer_city, description: "Customer city as supplied by Olist."}
          - {name: customer_state, description: "Two-letter Brazilian state code for the customer."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_products
        description: Full-refresh Olist product records at one row per product, preserving source column spellings.
        columns:
          - {name: product_id, description: "Unique identifier assigned to the product."}
          - {name: product_category_name, description: "Product category name in Portuguese."}
          - {name: product_name_lenght, description: "Character count of the product name; source spelling is preserved in Bronze."}
          - {name: product_description_lenght, description: "Character count of the product description; source spelling is preserved in Bronze."}
          - {name: product_photos_qty, description: "Number of product photos published in the listing."}
          - {name: product_weight_g, description: "Product weight in grams."}
          - {name: product_length_cm, description: "Product package length in centimeters."}
          - {name: product_height_cm, description: "Product package height in centimeters."}
          - {name: product_width_cm, description: "Product package width in centimeters."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_sellers
        description: Full-refresh Olist seller records at one row per seller.
        columns:
          - {name: seller_id, description: "Unique identifier assigned to the seller."}
          - {name: seller_zip_code_prefix, description: "First five digits of the seller's postal code."}
          - {name: seller_city, description: "Seller city as supplied by Olist."}
          - {name: seller_state, description: "Two-letter Brazilian state code for the seller."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_geolocation
        description: Full-refresh postal-prefix geolocation observations; prefixes may have multiple coordinates.
        columns:
          - {name: geolocation_zip_code_prefix, description: "First five digits of the represented postal code."}
          - {name: geolocation_lat, description: "Latitude of the geolocation observation."}
          - {name: geolocation_lng, description: "Longitude of the geolocation observation."}
          - {name: geolocation_city, description: "City associated with the geolocation observation."}
          - {name: geolocation_state, description: "Two-letter Brazilian state code associated with the observation."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

      - name: raw_product_category_translation
        description: Full-refresh mapping of Portuguese product category names to English.
        columns:
          - {name: product_category_name, description: "Product category name in Portuguese."}
          - {name: product_category_name_english, description: "English translation of the product category name."}
          - {name: created_ts, description: "Timestamp when ingestion wrote the Bronze row."}
          - {name: batch_id, description: "Identifier of the ingestion batch that wrote the row."}
          - {name: source, description: "Source file or system recorded by ingestion."}

  - name: transformation_control
    schema: staging
    description: Operational transformation-batch state and source-to-target model lineage maintained by the Prefect transformation flow.
    tables:
      - name: transformation_batches
        description: Operational lifecycle of dbt candidate builds, quality validation, and Gold promotion.
        columns:
          - {name: batch_id, description: "Transformation identifier composed from a job prefix and POSIX timestamp seconds."}
          - {name: pipeline_name, description: "Stable logical name of the transformation pipeline."}
          - {name: status, description: "Current transformation lifecycle state."}
          - {name: started_ts, description: "Timestamp when the transformation started."}
          - {name: completed_ts, description: "Timestamp when the transformation reached a terminal state."}
          - {name: promoted_ts, description: "Timestamp when the validated target became available in Gold."}
          - {name: failed_step_name, description: "Name of the dbt, Great Expectations, or promotion step that failed."}
          - {name: error_message, description: "Concise transformation-level failure message."}
          - {name: created_ts, description: "Timestamp when the control record was created."}
      - name: model_batch_control
        description: Append-only mapping of source ingestion batches selected for each model target batch.
        columns:
          - {name: model_name, description: "dbt model whose change set is influenced by the source batch."}
          - {name: source_dataset_name, description: "Dataset name recorded in the Bronze ingestion control table."}
          - {name: source_batch_id, description: "Text identifier of the successful source ingestion execution."}
          - {name: target_batch_id, description: "Text identifier of the transformation execution selecting the source batch."}
          - {name: created_ts, description: "Timestamp when the source-to-target lineage row was recorded."}
      - name: transformation_step_runs
        description: Detailed execution outcome for every dbt, Great Expectations, and Gold-promotion gate.
        columns:
          - {name: batch_id, description: "Transformation batch containing the step."}
          - {name: step_name, description: "Stable name identifying the transformation gate."}
          - {name: step_type, description: "Validation or execution system: dbt, great_expectations, or promotion."}
          - {name: status, description: "Current step status: running, success, or failed."}
          - {name: started_ts, description: "Timestamp when the step started."}
          - {name: completed_ts, description: "Timestamp when the step succeeded or failed."}
          - {name: error_message, description: "Concise error summary when the step failed."}
          - {name: failure_details, description: "Structured JSON details identifying failed dbt resources or Great Expectations checks."}
          - {name: created_ts, description: "Timestamp when the step record was created."}
