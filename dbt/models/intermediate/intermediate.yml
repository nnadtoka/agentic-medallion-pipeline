version: 2

models:
  - name: int_order_item_totals
    description: Order-level item and freight aggregates used to enrich the order fact without fanout.
    columns:
      - name: order_id
        description: Identifier of the aggregated order.
        data_tests: [not_null, unique]
      - {name: item_count, description: "Number of line items in the order."}
      - {name: distinct_product_count, description: "Number of distinct products in the order."}
      - {name: distinct_seller_count, description: "Number of distinct sellers represented in the order."}
      - {name: item_value, description: "Sum of item prices for the order in Brazilian reais."}
      - {name: freight_value, description: "Sum of item-level freight amounts for the order in Brazilian reais."}
      - {name: order_item_value, description: "Combined item price and freight value for the order in Brazilian reais."}
      - {name: created_ts, description: "Latest Bronze creation timestamp among the contributing item rows."}
      - {name: src_batch_id, description: "Contributing batch identifier when every item came from one batch; otherwise null."}

  - name: int_order_payment_totals
    description: Order-level payment aggregates used to enrich the order fact without fanout.
    columns:
      - name: order_id
        description: Identifier of the aggregated order.
        data_tests: [not_null, unique]
      - {name: payment_count, description: "Number of payment records associated with the order."}
      - {name: payment_installments, description: "Sum of installment counts across the order's payment records."}
      - {name: payment_value, description: "Total payment value for the order in Brazilian reais."}
      - {name: created_ts, description: "Latest Bronze creation timestamp among the contributing payment rows."}
      - {name: src_batch_id, description: "Contributing batch identifier when every payment came from one batch; otherwise null."}

  - name: int_order_review_summary
    description: Order-level review metrics used to enrich the order fact without fanout.
    columns:
      - name: order_id
        description: Identifier of the aggregated order.
        data_tests: [not_null, unique]
      - {name: review_count, description: "Number of review records associated with the order."}
      - {name: average_review_score, description: "Mean review score for the order, rounded to two decimal places."}
      - {name: minimum_review_score, description: "Lowest review score recorded for the order."}
      - {name: maximum_review_score, description: "Highest review score recorded for the order."}
      - {name: first_review_date, description: "Earliest review creation timestamp recorded for the order."}
      - {name: created_ts, description: "Latest Bronze creation timestamp among the contributing review rows."}
      - {name: src_batch_id, description: "Contributing batch identifier when every review came from one batch; otherwise null."}

  - name: int_customer_order_history
    description: Customer-level order history metrics derived from the currently ingested order partitions.
    columns:
      - name: customer_id
        description: Order-specific customer identifier.
        data_tests: [not_null, unique]
      - {name: customer_unique_id, description: "Stable customer identifier mapped from the customer snapshot; nullable when no customer record is available."}
      - {name: first_order_ts, description: "Earliest observed order purchase timestamp for the customer."}
      - {name: latest_order_ts, description: "Latest observed order purchase timestamp for the customer."}
      - {name: order_count, description: "Number of currently ingested orders associated with the customer identifier."}
      - {name: created_ts, description: "Latest Bronze creation timestamp among the contributing order rows."}
      - {name: src_batch_id, description: "Contributing batch identifier when every order came from one batch; otherwise null."}

  - name: int_unique_customer_order_history
    description: Order history rolled up to the stable Olist customer identity across order-specific customer records.
    columns:
      - name: customer_unique_id
        description: Stable customer identifier and model grain.
        data_tests: [not_null, unique]
      - name: customer_id_count
        description: Number of distinct order-specific customer identifiers mapped to the stable customer.
        data_tests: [not_null, non_negative]
      - name: first_order_ts
        description: Earliest observed purchase timestamp across the customer's order-specific identifiers.
        data_tests: [not_null]
      - name: latest_order_ts
        description: Latest observed purchase timestamp across the customer's order-specific identifiers.
        data_tests: [not_null]
      - name: order_count
        description: Number of currently ingested orders associated with the stable customer identifier.
        data_tests: [not_null, non_negative]
      - name: created_ts
        description: Latest Bronze creation timestamp among the contributing customer-order-history rows.
        data_tests: [not_null]
      - {name: src_batch_id, description: "Contributing order batch identifier when every history row came from the same batch; otherwise null."}

  - name: int_customer_category_activity
    description: Daily purchased-item activity by stable customer and product category, excluding canceled orders.
    columns:
      - {name: customer_unique_id, description: "Stable customer identifier and part of the model grain.", data_tests: [not_null]}
      - {name: category_name, description: "English category when available, otherwise Portuguese or unknown; part of the model grain.", data_tests: [not_null]}
      - {name: activity_date, description: "Order purchase date and part of the model grain.", data_tests: [not_null]}
      - {name: item_count, description: "Purchased line-item count.", data_tests: [not_null, non_negative]}
      - {name: item_value, description: "Merchandise value in Brazilian reais.", data_tests: [not_null, non_negative]}
      - {name: freight_value, description: "Freight value in Brazilian reais.", data_tests: [not_null, non_negative]}
      - {name: total_value, description: "Merchandise plus freight value in Brazilian reais.", data_tests: [not_null, non_negative]}
      - {name: first_purchase_ts, description: "First purchase timestamp represented by the daily row.", data_tests: [not_null]}
      - {name: latest_purchase_ts, description: "Latest purchase timestamp represented by the daily row.", data_tests: [not_null]}
      - {name: created_ts, description: "Latest contributing source creation timestamp.", data_tests: [not_null]}

  - name: int_products_enriched
    description: Products joined with their English category translation, ahead of the product dimension.
    columns:
      - name: product_id
        description: Product identifier.
        data_tests: [not_null, unique]
      - {name: product_category_name, description: "Product category name in Portuguese."}
      - {name: product_category_name_english, description: "English category translation when a mapping is available."}
      - {name: product_name_length, description: "Character count of the product name."}
      - {name: product_description_length, description: "Character count of the product description."}
      - {name: product_photos_qty, description: "Number of product photos published in the listing."}
      - {name: product_weight_g, description: "Product weight in grams."}
      - {name: product_length_cm, description: "Product package length in centimeters."}
      - {name: product_height_cm, description: "Product package height in centimeters."}
      - {name: product_width_cm, description: "Product package width in centimeters."}
      - {name: created_ts, description: "Latest creation timestamp from the product or category-translation source row."}
      - {name: src_batch_id, description: "Ingestion batch identifier that supplied the product snapshot row."}

  - name: int_sellers
    description: Seller snapshot passed through intermediate so the seller dimension has a testable upstream layer.
    columns:
      - name: seller_id
        description: Seller identifier.
        data_tests: [not_null, unique]
      - {name: seller_zip_code_prefix, description: "First five digits of the seller's postal code."}
      - {name: seller_city, description: "Seller city as supplied by Olist."}
      - {name: seller_state, description: "Two-letter Brazilian state code for the seller."}
      - {name: created_ts, description: "Timestamp when ingestion wrote the seller snapshot row to Bronze."}
      - {name: src_batch_id, description: "Ingestion batch identifier that supplied the seller snapshot row."}

  - name: int_date_spine
    description: Calendar date spine covering the date range currently present in Bronze orders, ahead of the date dimension.
    columns:
      - name: date_key
        description: Integer calendar key in YYYYMMDD format.
        data_tests: [not_null, unique]
      - name: date_day
        description: Calendar date represented by the row.
        data_tests: [not_null, unique]
      - {name: year_number, description: "Four-digit calendar year."}
      - {name: quarter_number, description: "Calendar quarter number from 1 through 4."}
      - {name: month_number, description: "Calendar month number from 1 through 12."}
      - {name: month_name, description: "English calendar month name."}
      - {name: iso_day_of_week, description: "ISO weekday number where Monday is 1 and Sunday is 7."}
      - {name: day_name, description: "English weekday name."}
      - {name: iso_week_number, description: "ISO week number."}
      - {name: is_weekend, description: "True for Saturday and Sunday."}
      - {name: created_ts, description: "Timestamp of the dbt run that created the date-spine row."}

  - name: int_order_items_enriched
    description: Order items joined with their order's purchase date, ahead of the order-item fact.
    columns:
      - name: order_id
        description: Identifier of the order containing the item.
        data_tests: [not_null]
      - name: order_item_id
        description: Item sequence within the order.
        data_tests: [not_null]
      - {name: product_id, description: "Identifier of the purchased product."}
      - {name: seller_id, description: "Identifier of the seller fulfilling the item."}
      - {name: purchase_date_key, description: "Nullable YYYYMMDD purchase-date key; null until the matching order partition has been ingested."}
      - {name: shipping_limit_date, description: "Seller shipping deadline for the item."}
      - name: price
        description: Item price in Brazilian reais.
        data_tests: [non_negative]
      - name: freight_value
        description: Freight amount allocated to the item in Brazilian reais.
        data_tests: [non_negative]
      - {name: total_item_value, description: "Combined price and freight value for the item in Brazilian reais."}
      - {name: created_ts, description: "Timestamp when ingestion wrote the order-item row to Bronze."}
      - {name: src_batch_id, description: "Ingestion batch identifier that supplied the order-item row."}

  - name: int_order_payments_enriched
    description: Order payments joined with their order's purchase date, ahead of the order-payment fact.
    columns:
      - name: order_id
        description: Identifier of the paid order.
        data_tests: [not_null]
      - name: payment_sequential
        description: Payment sequence within the order.
        data_tests: [not_null]
      - {name: purchase_date_key, description: "Nullable YYYYMMDD purchase-date key; null until the matching order partition has been ingested."}
      - {name: payment_type, description: "Payment method reported by Olist."}
      - {name: payment_installments, description: "Number of installments selected for the payment."}
      - name: payment_value
        description: Payment amount in Brazilian reais.
        data_tests: [non_negative]
      - {name: created_ts, description: "Timestamp when ingestion wrote the payment row to Bronze."}
      - {name: src_batch_id, description: "Ingestion batch identifier that supplied the payment row."}
